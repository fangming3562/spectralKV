[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectralkv"
version = "0.1.0"
description = "Redundancy-aware KV cache compression with dynamic and fixed layer pipelines"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.9,<2.10", "transformers>=4.57.6,<4.58", "triton>=3.5,<3.6", "numpy>=2.2,<2.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "ruff>=0.9"]

[project.scripts]
spectralkv = "spectralkv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectralkv = ["csrc/*.cpp", "profiles/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cuda: requires a CUDA GPU", "model: requires locally available Llama or Qwen3 weights"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"src/spectralkv/kernels/*.py" = ["E741"]
